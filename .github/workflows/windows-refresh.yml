name: Windows VR frontend bundle
on:
  workflow_run:
    workflows: ['Windows desktop build']
    types: [completed]
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Successful Windows desktop build run ID'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SOURCE_RUNTIME_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the previous runtime has identical native sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ env.SOURCE_RUNTIME_RUN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/verify_windows_runtime.py
      - name: Download the previous private runtime
        uses: actions/download-artifact@v4
        with:
          name: Cardinal-3D-Windows
          run-id: ${{ env.SOURCE_RUNTIME_RUN }}
          github-token: ${{ github.token }}
          path: build/previous-artifact
      - name: Package current frontend with the verified runtime
        run: |
          python -m zipfile -e build/previous-artifact/Cardinal-3D-Windows.zip build/previous
          python scripts/package_windows.py --reuse-runtime build/previous/Cardinal-3D-Windows
      - name: Preserve private development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cardinal-3D-Windows
          path: dist/Cardinal-3D-Windows.zip
          if-no-files-found: error
          retention-days: 7
