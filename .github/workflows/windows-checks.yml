name: Windows bridge checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and exercise Winsock transport
        shell: cmd
        run: |
          mkdir build
          cl /nologo /std:c++17 /EHsc /W4 tests\transport_test.cpp ws2_32.lib /Fe:build\transport-test.exe
          build\transport-test.exe
      - name: Validate Python scripts
        run: python -m compileall -q scripts tests
      - name: Download pinned Godot for headless frontend checks
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_win64.exe.zip -OutFile build/godot.zip
          Expand-Archive build/godot.zip -DestinationPath build/godot
      - name: Exercise tracked hand gestures and native interaction routing
        shell: pwsh
        run: |
          $godot = (Get-ChildItem build/godot/*_win64_console.exe).FullName
          & $godot --headless --editor --path godot --quit
          python scripts/check_frontend.py $godot ../tests/frontend_xr.gd
          python scripts/check_frontend.py $godot ../tests/frontend_stream.gd
